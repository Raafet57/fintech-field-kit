name: Rebuild catalog

on:
  push:
    branches: [main]
    paths:
      - '**/*.pdf'
      - '**/*.PDF'
  workflow_dispatch:

jobs:
  rebuild-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild catalog.json
        run: python scripts/build_catalog.py

      - name: Commit updated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scripts/catalog.json docs/ catalog.md tree.md README.md || true
          git diff --cached --quiet || git commit -m 'catalog: auto-rebuild after PDF upload'
          git push origin main
